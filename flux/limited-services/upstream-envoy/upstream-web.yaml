apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: web-upstream
  namespace: limited-services
spec:
  endpoints:
    - fqdn:
        hostname: api.chucknorris.io
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: web-upstream-tls
  namespace: limited-services
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: web-upstream
  validation:
    wellKnownCACertificates: System
    hostname: api.chucknorris.io
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: upstream-web
  namespace: limited-services
spec:
  hostnames:
    - "kind.418.local"
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: web
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /chuck
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: api.chucknorris.io
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: web-upstream
