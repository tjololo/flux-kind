apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: valkey
      version: 0.11.0
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  releaseName: valkey
  dependsOn:
    - name: linkerd
      namespace: linkerd
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  targetNamespace: valkey-system
  values: {}