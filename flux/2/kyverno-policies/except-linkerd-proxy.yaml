apiVersion: v1
kind: Namespace
metadata:
  name: kyverno-policies
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: allow-linkerd-capabilities
  namespace: traefik-system
spec:
  policyRefs:
  - kind: ValidatingPolicy
    name: disallow-capabilities
  matchConditions:
    - name: only-except-linkerd-proxy-capabilities
      expression: >-
         ((object.metadata.?annotations['linkerd.io/inject'].orValue('') == 'enabled') || (resource.Get("v1", "namespaces", "", request.namespace).metadata.?annotations['linkerd.io/inject'].orValue('') == 'enabled') || (request.namespace == 'linkerd')) && (has(object.spec.template) ? (object.spec.template.spec.containers + object.spec.template.spec.?initContainers.orValue([])) : (object.spec.containers + object.spec.?initContainers.orValue([]))).all(c, !c.?securityContext.?capabilities.?add.orValue([]).exists(cap, cap in ['NET_ADMIN', 'NET_RAW']) || c.image.matches('^.*linkerd/proxy.*$'))
---
