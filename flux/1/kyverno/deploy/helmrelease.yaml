apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
      version: 3.7.1
  interval: 1h
  timeout: 5m
  install:
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    # Kyverno caches API discovery and only invalidates it every 15m. The Envoy Gateway
    # CRDs are installed in wave 3, after Kyverno starts in wave 1, so without this the
    # fail-closed vpol webhook cannot resolve backends.gateway.envoyproxy.io and denies
    # every Backend the limited-services tenant applies. See kyverno/kyverno#10729.
    global:
      crdWatcher: true
    admissionController:
      crdWatcher: true
    webhooks:
      namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - flux-system
    config:
      excludeKyvernoNamespace: true
      resourceFiltersIncludeNamespaces:
        - kube-system
        - kube-node-lease
        - kube-public
        - flux-system
    features:
      policyExceptions:
        enabled: true
        namespace: 'kyverno'