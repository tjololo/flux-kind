apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: gateway-helm
  releaseName: eg
  dependsOn:
    - name: linkerd
      namespace: linkerd
  install:
    # The chart ships both the Gateway API and the Envoy Gateway CRDs in its
    # crds/ directory, where the crds.gatewayAPI.enabled value cannot gate them.
    # Both sets are vendored under flux/3 instead so their versions stay ours.
    crds: Skip
  upgrade:
    crds: Skip
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  targetNamespace: envoy-gateway-system
  values:
    config:
      envoyGateway:
        extensionApis:
          enableBackend: true