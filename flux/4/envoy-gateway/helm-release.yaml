apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: envoy-gateway
      version: 1.9.0
      sourceRef:
        kind: HelmRepository
        name: envoy-proxy
        namespace: flux-system
  releaseName: envoy-gateway
  dependsOn:
    - name: linkerd
      namespace: linkerd
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  targetNamespace: envoy-gateway-system
  values: {}