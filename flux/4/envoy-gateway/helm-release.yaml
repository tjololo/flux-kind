apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: gateway-helm
  releaseName: eg
  dependsOn:
    - name: linkerd
      namespace: linkerd
  install:
    crds: Skip
  upgrade:
    crds: Skip
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  targetNamespace: envoy-gateway-system
  values: {}