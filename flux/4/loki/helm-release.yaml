apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  chart:
    spec:
      chart: loki
      version: 7.3.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  releaseName: loki
  dependsOn:
    - name: linkerd
      namespace: linkerd
    - name: minio
      namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  targetNamespace: monitoring
  interval: 1h
  timeout: 5m
  values:
    loki:
      auth_enabled: false
      storage:
        type: s3
        s3:
          endpoint: minio.monitoring.svc.cluster.local:9000
          region: us-east-1
          accessKeyId: minioadmin
          secretAccessKey: minioadmin123
          s3ForcePathStyle: true
          # Shared MinIO has no TLS in this kind cluster.
          insecure: true
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
          admin: loki-admin
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

    # 3-worker kind cluster: one binary holding every Loki component instead
    # of the chart's default scalable read/write/backend split.
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      persistence:
        enabled: true
        storageClass: standard
        size: 10Gi
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    # Collector and Grafana both talk to the gateway, not the binary directly.
    gateway:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi

    # Saves resources on kind - neither is needed for this deployment to work.
    lokiCanary:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    test:
      enabled: false
    monitoring:
      selfMonitoring:
        enabled: false
      lokiCanary:
        enabled: false
      serviceMonitor:
        enabled: false
