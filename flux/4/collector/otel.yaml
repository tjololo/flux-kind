apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: otel-col
spec:
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.140.1
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    linkerd.io/inject: "enabled"
    # Only bypasses the mesh for outbound 443 (some external HTTPS call this
    # collector already makes). Mimir and Loki are in-mesh on 80 and Tempo on
    # 4317, so they still get intercepted and meshed normally - nothing to add
    # here for them.
    config.linkerd.io/skip-outbound-ports: "443"
  resources:
    limits:
      memory: 1000Mi
    requests:
      cpu: 500m
      memory: 256Mi
  mode: deployment
  upgradeStrategy: automatic
  serviceAccount: otel-collector
  observability:
    metrics:
      disablePrometheusAnnotations: true
      enableMetrics: true
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Scrapes that don't fit the otlp receiver: things that only speak
      # Prometheus exposition and were never going to push to us.
      prometheus:
        config:
          scrape_configs:
            - job_name: linkerd-proxy
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                # Only the linkerd-proxy sidecar container...
                - source_labels: [__meta_kubernetes_pod_container_name]
                  action: keep
                  regex: ^linkerd-proxy$
                # ...on its named admin port (4191) - role: pod already
                # builds __address__ as <pod_ip>:<that port> once matched.
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: ^linkerd-admin$
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
              metrics_path: /metrics
            - job_name: envoy-gateway
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                      - envoy-gateway-system
              relabel_configs:
                # envoy-gateway-system also holds the (unmeshed) control
                # plane pod - keep only the data-plane pods Envoy Gateway
                # itself manages for a Gateway.
                - source_labels: [__meta_kubernetes_pod_label_gateway_envoyproxy_io_owning_gateway_name]
                  action: keep
                  regex: .+
                # Envoy's admin listener isn't exposed as a named container
                # port, so point directly at its default port.
                - source_labels: [__meta_kubernetes_pod_ip]
                  action: replace
                  regex: (.+)
                  target_label: __address__
                  replacement: '$${1}:19000'
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
              metrics_path: /stats/prometheus
    processors:
      batch: {}
      # Extract k8s attributes
      k8sattributes:
        auth_type: 'serviceAccount'
        wait_for_metadata: true
        wait_for_metadata_timeout: 10s
        extract:
          metadata: # extracted from the pod
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.job.name
            - k8s.cronjob.name
            - k8s.daemonset.name
            - k8s.node.name
            - service.name
          labels:
            - tag_name: otel.sampling
              key: otel/sampling
              from: deployment
        pod_association:
          - sources:
              # This rule associates all resources containing the 'k8s.pod.ip' attribute with the matching pods. If this attribute is not present in the resource, this rule will not be able to find the matching pod.
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              # This rule associates all resources containing the 'k8s.pod.uid' attribute with the matching pods. If this attribute is not present in the resource, this rule will not be able to find the matching pod.
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      # DIS platform specific transformations
      transform/sampling:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
            # Ensure otel sampling suggestion is set
            - set(attributes["otel.sampling"], resource.attributes["otel.sampling"]) where resource.attributes["otel.sampling"] != nil
            - set(attributes["otel.sampling"], "minimum") where attributes["otel.sampling"] == nil
      tail_sampling:
        decision_wait: 10s
        num_traces: 1000
        policies:
          - name: default
            type: and
            and:
              and_sub_policy:
                - name: not-route-live-ready-policy
                  type: string_attribute
                  string_attribute:
                    key: http.route
                    values: 
                      - "^/metrics"
                      - "^/health"
                    invert_match: true
                    enabled_regex_matching: true
                - name: not-all-sampling-attr
                  type: string_attribute
                  string_attribute:
                    key: otel.sampling
                    values: [all]
                    invert_match: true
                - name: probabilistic-policy
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: 1
          - name: sample-all
            type: and
            and:
              and_sub_policy:
                - name: not-route-live-ready-policy
                  type: string_attribute
                  string_attribute:
                    key: http.route
                    values: 
                      - "^/metrics"
                      - "^/health"
                    invert_match: true
                    enabled_regex_matching: true
                - name: all-sampling-attr
                  type: string_attribute
                  string_attribute:
                    key: otel.sampling
                    values: [all]
                - name: probabilistic-policy
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: 100
          - name: heavy-sampling
            type: and
            and:
              and_sub_policy:
                - name: route-live-ready-policy
                  type: string_attribute
                  string_attribute:
                    key: http.route
                    values: 
                      - "^/metrics"
                      - "^/health"
                    enabled_regex_matching: true
                  # apply probabilistic sampling
                - name: probabilistic-policy
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: 0.1
          - name: always-sample-errors
            type: and
            and:
              and_sub_policy:
                - name: trace-status-policy
                  type: status_code
                  status_code:
                    status_codes:
                      - ERROR
          - name: always-sample-slow-requests
            type: latency
            latency:
              threshold_ms: 1000
      filter/logs:
        error_mode: ignore
        logs:
          log_record:
          - 'severity_number < SEVERITY_NUMBER_WARN' #Drop all Info, debug, trace and unspecified logs
          - 'attributes["error"] == "secret default/ssl-cert does not exist"' # Remove noisy logs from traefik that is there due to some legacy configuration that does not affect the service
      # Memory limiter to mitigate out of memory situations
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15

    exporters:
      # Kept alongside the real exporters below for local troubleshooting.
      debug: {}
      otlphttp/mimir:
        # otlphttp appends /v1/metrics itself, landing on Mimir's OTLP
        # ingestion endpoint at /otlp/v1/metrics.
        endpoint: http://mimir-nginx.monitoring.svc.cluster.local/otlp
      otlp/tempo:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/loki:
        # Same story as Mimir: this lands on Loki's OTLP endpoint at
        # /otlp/v1/logs.
        endpoint: http://loki-gateway.monitoring.svc.cluster.local/otlp

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, transform/sampling, tail_sampling, batch]
          exporters: [debug, otlp/tempo]
        logs:
          receivers: [otlp]
          processors: [filter/logs, memory_limiter, k8sattributes, batch]
          exporters: [debug, otlphttp/loki]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [debug, otlphttp/mimir]
