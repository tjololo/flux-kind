apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eg-linkerd
  namespace: envoy-gateway-system
spec:
  # Route to the backend Service ClusterIP instead of the pod endpoints. The
  # linkerd-proxy only gets a service-level destination lookup - and with it
  # mTLS, load balancing and policy - when the connection targets a ClusterIP.
  # Endpoint routing (the default) hands it raw pod IPs, which bypasses that.
  routingType: Service
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          annotations:
            linkerd.io/inject: enabled
  telemetry:
    metrics:
      sinks:
        - type: OpenTelemetry
          openTelemetry:
            host: otel-collector.otel-col.svc.cluster.local
            port: 4317
    tracing:
      # sample 100% of requests
      samplingRate: 100
      provider:
        backendRefs:
        - name: otel-collector
          namespace: otel-col
          port: 4317
        type: OpenTelemetry
      customTags:
        # This is an example of using a literal as a tag value
        provider:
          type: Literal
          literal:
            value: "otel"
        "k8s.pod.name":
          type: Environment
          environment:
            name: ENVOY_POD_NAME
            defaultValue: "-"
        "k8s.namespace.name":
          type: Environment
          environment:
            name: ENVOY_POD_NAMESPACE
            defaultValue: "envoy-gateway-system"
        # This is an example of using a header value as a tag value
